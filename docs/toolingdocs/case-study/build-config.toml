# The values in this file are evidence from TEMPLATE-COMPATIBILITY.md, not guesses.
[template]
source = "https://github.com/kleiveist/Latex-Template"
commit_sha = "76b8efe19662a378eda568eddcdd4c96a5e649de"
reference_tree = "e108ed89f1c539eeb0489cab158205b71d75e0ea"
audit_status = "audited-no-upstream-files-imported"
license_status = "no-license-declared-no-upstream-files-imported"

[toolchain]
engine = "pdflatex"
bibliography_backend = "biber"
tex_distribution = "CI-recorded TeX Live package set (reference PDF: TeX Live 2025)"
environment_pinning = "runner label pinned; package repository release recorded, not immutable"
shell_escape = false

[build]
source_date_epoch = 1787788800 # 2026-08-27T00:00:00Z
max_latex_passes = 3
timeout_seconds = 180
byte_identical_pdfs = true
default_output = ".tooling-state/docs/case-study"
pdf_prefix = "portable-tooling-case-study"
tooling_version = "0.4.0"

[languages.de]
main = "source/de/main.tex"
pdf_language = "de-DE"
pdf_title = "Portable Toolingarchitektur"

[languages.en]
main = "source/en/main.tex"
pdf_language = "en-US"
pdf_title = "Portable Tooling Architecture"
