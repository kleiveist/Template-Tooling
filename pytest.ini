[pytest]
addopts = --strict-markers
markers =
    portable: test belongs to the portable tooling payload and may be run from an export
    source_repository: test validates only this source repository and is excluded from exports
    unit: isolated unit-level behaviour test
    integration: integration between tooling components or a controlled project fixture
    system: operating-system, filesystem, path, or process behaviour test
    acceptance: black-box independent target-project acceptance test
    upgrade: version-to-version tooling migration test
    rollback: transactional failure and rollback test
    network: test requiring an external network/package source
    slow: test intended for main, nightly, or release validation
    latex: test for the bilingual LaTeX case-study sources or PDF build
    windows: test that requires or specifically validates Windows behaviour
    linux: test that requires or specifically validates Linux behaviour
    macos: test that requires or specifically validates macOS behaviour
