name: Upgrade

on:
  workflow_call:
  push:
    branches: [main]
    tags: ["tooling-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  support-matrix:
    name: Read upgrade baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python_primary: ${{ steps.matrix.outputs.python_primary }}
      baseline_ref: ${{ steps.matrix.outputs.upgrade_baseline_ref }}
      linux: ${{ steps.matrix.outputs.linux_runner }}
      windows: ${{ steps.matrix.outputs.windows_runner }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: matrix
        name: Read central support contract
        run: python tools/ci_support.py --github-output

  real-version-upgrade:
    name: real-version-upgrade
    needs: support-matrix
    runs-on: ${{ needs.support-matrix.outputs.linux }}
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
      UPGRADE_BASELINE_REF: ${{ needs.support-matrix.outputs.baseline_ref }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up current isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
      - name: Materialize isolated old and current source trees
        shell: pwsh
        run: |
          $old = Join-Path $env:RUNNER_TEMP "source-old"
          $current = Join-Path $env:RUNNER_TEMP "source-current"
          git worktree add --detach $old $env:UPGRADE_BASELINE_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git worktree add --detach $current HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UPGRADE_SOURCE_OLD=$old" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UPGRADE_SOURCE_CURRENT=$current" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Start the historical tooling in a separate virtual environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "venv-old"
          & $env:TOOLING_PYTHON -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv "bin/python"
          & $python -m pip install --disable-pip-version-check --requirement (Join-Path $env:UPGRADE_SOURCE_OLD "tools/requirements.txt")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python (Join-Path $env:UPGRADE_SOURCE_OLD "tools/control.py") --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare current tooling in its own virtual environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "venv-current"
          & $env:TOOLING_PYTHON -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv "bin/python"
          & $python -m pip install --disable-pip-version-check --requirement (Join-Path $env:UPGRADE_SOURCE_CURRENT "tools/requirements.txt")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UPGRADE_CURRENT_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise immutable historical payloads through current migrations
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "real-version-upgrade.junit.xml"
          Push-Location $env:UPGRADE_SOURCE_CURRENT
          try {
            & $env:UPGRADE_CURRENT_PYTHON -m pytest -q -p no:cacheprovider --junitxml=$junit tests/source/test_historical_tooling_migration.py
            $exitCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-version-upgrade-junit
          path: ${{ runner.temp }}/real-version-upgrade.junit.xml
          if-no-files-found: warn
          retention-days: 30

  windows-upgrade:
    name: windows-upgrade
    needs: support-matrix
    runs-on: ${{ needs.support-matrix.outputs.windows }}
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out complete source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
      - name: Exercise historical payload migration on Windows
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "windows-upgrade.junit.xml"
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider --junitxml=$junit tests/source/test_historical_tooling_migration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows upgrade evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-upgrade-junit
          path: ${{ runner.temp }}/windows-upgrade.junit.xml
          if-no-files-found: warn
          retention-days: 30
