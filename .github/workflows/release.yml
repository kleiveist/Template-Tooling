name: Release

on:
  push:
    tags: ["tooling-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  support-matrix:
    name: Read release support matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python_primary: ${{ steps.matrix.outputs.python_primary }}
      node_primary: ${{ steps.matrix.outputs.node_primary }}
      rust_channel: ${{ steps.matrix.outputs.rust_channel }}
      linux: ${{ steps.matrix.outputs.linux_runner }}
      windows: ${{ steps.matrix.outputs.windows_runner }}
      macos: ${{ steps.matrix.outputs.macos_runner }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: matrix
        name: Read central support contract
        run: python tools/ci_support.py --github-output

  gate-zero:
    name: gate-zero
    needs: support-matrix
    runs-on: ${{ needs.support-matrix.outputs.linux }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
          node-version: ${{ needs.support-matrix.outputs.node_primary }}
          rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      - name: Run concrete Gate 0 capability tests
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "gate-zero.junit.xml"
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider --junitxml=$junit tools/tests/adapters/test_builtin_adapters.py tools/tests/adapters/test_profile_structured_mutations.py tools/tests/integration/test_actions.py tools/tests/integration/test_transaction.py tools/tests/integration/test_transaction_project_config.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Refuse synthetic release acceptance for missing implementation
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "gate-zero.json"
          $output = & $env:TOOLING_PYTHON -m tools.ci_gate --require-ready
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path $report -Encoding utf8
          $output
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Upload Gate 0 status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-zero-status
          path: |
            ${{ runner.temp }}/gate-zero.json
            ${{ runner.temp }}/gate-zero.junit.xml
          if-no-files-found: warn
          retention-days: 90

  real-version-upgrade:
    name: real-version-upgrade
    uses: ./.github/workflows/ci-upgrade.yml

  documentation-release:
    name: documentation-release
    uses: ./.github/workflows/ci-documentation.yml

  release-acceptance-linux:
    name: release-acceptance-linux
    needs: [support-matrix, gate-zero]
    uses: ./.github/workflows/_portable-acceptance.yml
    with:
      runner: ${{ needs.support-matrix.outputs.linux }}
      python-version: ${{ needs.support-matrix.outputs.python_primary }}
      node-version: ${{ needs.support-matrix.outputs.node_primary }}
      rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      fixture-selection: ""
      profile-selection: ""
      include-historical-upgrade: true

  release-acceptance-windows:
    name: release-acceptance-windows
    needs: [support-matrix, gate-zero]
    uses: ./.github/workflows/_portable-acceptance.yml
    with:
      runner: ${{ needs.support-matrix.outputs.windows }}
      python-version: ${{ needs.support-matrix.outputs.python_primary }}
      node-version: ${{ needs.support-matrix.outputs.node_primary }}
      rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      fixture-selection: ""
      profile-selection: ""

  release-acceptance-macos:
    name: release-acceptance-macos-smoke
    needs: [support-matrix, gate-zero]
    uses: ./.github/workflows/_portable-acceptance.yml
    with:
      runner: ${{ needs.support-matrix.outputs.macos }}
      python-version: ${{ needs.support-matrix.outputs.python_primary }}
      node-version: ${{ needs.support-matrix.outputs.node_primary }}
      rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      fixture-selection: empty or vite
      profile-selection: web-only

  release-contract:
    name: release-contract
    needs: [support-matrix, gate-zero]
    runs-on: ${{ needs.support-matrix.outputs.linux }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out complete source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
      - name: Validate release contract and create portable export
        shell: pwsh
        run: |
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider tests/source/test_workflow_contracts.py tests/source/test_create_portable_release.py tools/tests/integration/test_export.py tools/tests/core/test_portable_payload.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content tools/VERSION -Raw).Trim()
          $expectedTag = "tooling-v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match tools/VERSION $version"
          }
          $parent = Join-Path $env:RUNNER_TEMP "release-export"
          New-Item -ItemType Directory -Path $parent | Out-Null
          & $env:TOOLING_PYTHON tools/control.py tooling export --output $parent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exportRoot = Join-Path $parent "Template-Tooling-$version"
          "PORTABLE_EXPORT_ROOT=$exportRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create deterministic release archive and checksum
        shell: pwsh
        run: |
          $assets = Join-Path $env:RUNNER_TEMP "portable-release-assets"
          New-Item -ItemType Directory -Path $assets | Out-Null
          & $env:TOOLING_PYTHON .github/scripts/create_portable_release.py --export-root $env:PORTABLE_EXPORT_ROOT --output-dir $assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload portable release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-release-assets
          path: ${{ runner.temp }}/portable-release-assets
          if-no-files-found: error
          retention-days: 90

  release-final:
    name: release-final
    needs:
      - real-version-upgrade
      - documentation-release
      - release-acceptance-linux
      - release-acceptance-windows
      - release-acceptance-macos
      - release-contract
      - gate-zero
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Require every release prerequisite to succeed
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          $failed = @()
          ($env:NEEDS_JSON | ConvertFrom-Json).psobject.Properties | ForEach-Object {
            if ($_.Value.result -ne "success") { $failed += "$($_.Name)=$($_.Value.result)" }
          }
          if ($failed.Count -gt 0) { throw "Release prerequisite failed: $($failed -join ', ')" }
      - name: Check out release metadata
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download deterministic release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-release-assets
          path: ${{ runner.temp }}/portable-release-assets
      - name: Verify release identity and checksum
        shell: pwsh
        run: |
          $version = (Get-Content tools/VERSION -Raw).Trim()
          $expectedTag = "tooling-v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match tools/VERSION $version"
          }
          $assets = Join-Path $env:RUNNER_TEMP "portable-release-assets"
          $archive = Join-Path $assets "Template-Tooling-$version.tar.gz"
          $checksums = Join-Path $assets "SHA256SUMS"
          if (-not (Test-Path -Path $archive -PathType Leaf)) { throw "Release archive is missing: $archive" }
          if (-not (Test-Path -Path $checksums -PathType Leaf)) { throw "Release checksums are missing: $checksums" }
          Push-Location $assets
          try {
            & sha256sum --check SHA256SUMS
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - id: attest
        name: Attest release archive provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/portable-release-assets/SHA256SUMS
      - name: Publish permanent GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $version = (Get-Content tools/VERSION -Raw).Trim()
          $assets = Join-Path $env:RUNNER_TEMP "portable-release-assets"
          $archive = Join-Path $assets "Template-Tooling-$version.tar.gz"
          $checksums = Join-Path $assets "SHA256SUMS"
          $attestation = Join-Path $assets "Template-Tooling-$version.intoto.jsonl"
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination $attestation

          & gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            & gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "Template Tooling $version" --notes-file RELEASE-NOTES.md --draft=false --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & gh release upload $env:GITHUB_REF_NAME $archive $checksums $attestation --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            & gh release create $env:GITHUB_REF_NAME $archive $checksums $attestation --repo $env:GITHUB_REPOSITORY --verify-tag --title "Template Tooling $version" --notes-file RELEASE-NOTES.md --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
