name: System

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  support-matrix:
    name: Read support matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python_primary: ${{ steps.matrix.outputs.python_primary }}
      os_matrix: ${{ steps.matrix.outputs.os_matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: matrix
        name: Read central support contract
        run: python tools/ci_support.py --github-output

  system:
    name: system-${{ matrix.name }}
    needs: support-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.support-matrix.outputs.os_matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
      - name: Run cross-platform system proof
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "system-${{ matrix.name }}.junit.xml"
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider --junitxml=$junit tools/tests/system tools/tests/test_process.py tools/tests/test_run_services.py tools/tests/test_stop_safety.py tools/tests/test_tauri_detached_safety.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload system evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-${{ matrix.name }}-junit
          path: ${{ runner.temp }}/system-${{ matrix.name }}.junit.xml
          if-no-files-found: warn
          retention-days: 14
