name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  support-matrix:
    name: Read support matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python_primary: ${{ steps.matrix.outputs.python_primary }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: matrix
        name: Read central support contract
        run: python tools/ci_support.py --github-output

  skip-audit:
    name: skip-audit
    needs: support-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
      - name: Audit explicit and bounded pytest skips
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "skip-audit.junit.xml"
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider --junitxml=$junit tests/source/test_skip_policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload skip-audit evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: skip-audit-junit
          path: ${{ runner.temp }}/skip-audit.junit.xml
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: quality
    needs: support-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
      - name: Check formatting for maintained CI boundaries
        shell: pwsh
        run: |
          $qualityPaths = @(
            "conftest.py",
            "tools/ci_gate.py",
            "tools/ci_support.py",
            "tools/adapters",
            "tools/integration",
            "tools/tests/acceptance/test_copy_matrix.py",
            "tools/tests/acceptance/test_profile_integration.py",
            "tools/tests/adapters/test_profile_structured_mutations.py",
            "tools/tests/core/test_support_matrix.py",
            "tools/tests/system",
            "tests/source/test_ci_gate.py",
            "tests/source/test_repository_packaging_policy.py",
            "tests/source/test_skip_policy.py",
            "tests/source/test_workflow_contracts.py",
            "docs/toolingdocs/case-study/scripts/_shared.py",
            "docs/toolingdocs/case-study/scripts/verify.py"
          )
          & $env:TOOLING_PYTHON -m ruff format --check $qualityPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint maintained CI boundaries
        shell: pwsh
        run: |
          $qualityPaths = @(
            "conftest.py",
            "tools/ci_gate.py",
            "tools/ci_support.py",
            "tools/adapters",
            "tools/integration",
            "tools/tests/acceptance/test_copy_matrix.py",
            "tools/tests/acceptance/test_profile_integration.py",
            "tools/tests/adapters/test_profile_structured_mutations.py",
            "tools/tests/core/test_support_matrix.py",
            "tools/tests/system",
            "tests/source/test_ci_gate.py",
            "tests/source/test_repository_packaging_policy.py",
            "tests/source/test_skip_policy.py",
            "tests/source/test_workflow_contracts.py",
            "docs/toolingdocs/case-study/scripts/_shared.py",
            "docs/toolingdocs/case-study/scripts/verify.py"
          )
          & $env:TOOLING_PYTHON -m ruff check $qualityPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate documentation and repository policy
        shell: pwsh
        run: |
          & $env:TOOLING_PYTHON tools/control.py docs check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider tests/source/test_repository_packaging_policy.py tests/source/test_workflow_contracts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check patch whitespace
        run: git diff --check
