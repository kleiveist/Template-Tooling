name: Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  support-matrix:
    name: Read support matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python_primary: ${{ steps.matrix.outputs.python_primary }}
      node_primary: ${{ steps.matrix.outputs.node_primary }}
      rust_channel: ${{ steps.matrix.outputs.rust_channel }}
      linux: ${{ steps.matrix.outputs.linux_runner }}
      windows: ${{ steps.matrix.outputs.windows_runner }}
      macos: ${{ steps.matrix.outputs.macos_runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: matrix
        name: Read central support contract
        run: python tools/ci_support.py --github-output

  gate-zero:
    name: gate-zero
    needs: support-matrix
    runs-on: ${{ needs.support-matrix.outputs.linux }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
          node-version: ${{ needs.support-matrix.outputs.node_primary }}
          rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      - name: Run concrete Gate 0 capability tests
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP "gate-zero.junit.xml"
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider --junitxml=$junit tools/tests/adapters/test_builtin_adapters.py tools/tests/adapters/test_profile_structured_mutations.py tools/tests/integration/test_actions.py tools/tests/integration/test_transaction.py tools/tests/integration/test_transaction_project_config.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Refuse synthetic acceptance success for missing implementation
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "gate-zero.json"
          $output = & $env:TOOLING_PYTHON -m tools.ci_gate --require-ready
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path $report -Encoding utf8
          $output
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Upload Gate 0 status
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-zero-status
          path: |
            ${{ runner.temp }}/gate-zero.json
            ${{ runner.temp }}/gate-zero.junit.xml
          if-no-files-found: warn
          retention-days: 14

  acceptance-copy-matrix:
    name: acceptance-copy-matrix
    needs: [support-matrix, gate-zero]
    uses: ./.github/workflows/_portable-acceptance.yml
    with:
      runner: ${{ needs.support-matrix.outputs.linux }}
      python-version: ${{ needs.support-matrix.outputs.python_primary }}
      node-version: ${{ needs.support-matrix.outputs.node_primary }}
      rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      fixture-selection: ${{ github.event_name == 'pull_request' && 'empty or vite or tauri' || '' }}
      profile-selection: web-only or desktop-local

  acceptance-profile-integration:
    name: acceptance-profile-integration
    needs: [support-matrix, gate-zero]
    uses: ./.github/workflows/_portable-acceptance.yml
    with:
      runner: ${{ needs.support-matrix.outputs.linux }}
      python-version: ${{ needs.support-matrix.outputs.python_primary }}
      node-version: ${{ needs.support-matrix.outputs.node_primary }}
      rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      fixture-selection: ${{ github.event_name == 'pull_request' && 'persisted and (web or desktop or full)' || '' }}
      profile-selection: ${{ github.event_name == 'pull_request' && 'web-cloud or desktop-cloud' || '' }}
      include-historical-upgrade: ${{ github.event_name != 'pull_request' }}

  acceptance-windows:
    name: acceptance-windows
    needs: [support-matrix, gate-zero]
    uses: ./.github/workflows/_portable-acceptance.yml
    with:
      runner: ${{ needs.support-matrix.outputs.windows }}
      python-version: ${{ needs.support-matrix.outputs.python_primary }}
      node-version: ${{ needs.support-matrix.outputs.node_primary }}
      rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      fixture-selection: ${{ github.event_name == 'pull_request' && 'vite or tauri or persisted or custom' || '' }}
      profile-selection: desktop-local or desktop-cloud or full-platform

  acceptance-macos:
    name: acceptance-macos-smoke
    needs: [support-matrix, gate-zero]
    uses: ./.github/workflows/_portable-acceptance.yml
    with:
      runner: ${{ needs.support-matrix.outputs.macos }}
      python-version: ${{ needs.support-matrix.outputs.python_primary }}
      node-version: ${{ needs.support-matrix.outputs.node_primary }}
      rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      fixture-selection: empty or vite
      profile-selection: web-only

  rollback-matrix:
    name: rollback-matrix
    needs: [support-matrix, gate-zero]
    runs-on: ${{ needs.support-matrix.outputs.linux }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
      TEMPLATE_TOOLING_NESTED_TEST: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
          node-version: ${{ needs.support-matrix.outputs.node_primary }}
          rust-version: ${{ needs.support-matrix.outputs.rust_channel }}
      - name: Run transactional rollback cases
        shell: pwsh
        run: |
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider tools/tests/integration/test_transaction.py tools/tests/integration/test_transaction_project_config.py tools/tests/integration/test_actions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  export-policy:
    name: export-policy
    needs: [support-matrix, gate-zero]
    runs-on: ${{ needs.support-matrix.outputs.linux }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up isolated tooling environment
        uses: ./.github/actions/setup-tooling-environment
        with:
          python-version: ${{ needs.support-matrix.outputs.python_primary }}
      - name: Prove deterministic export policy
        shell: pwsh
        run: |
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider tools/tests/core/test_portable_payload.py tools/tests/integration/test_export.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  final-ci-gate:
    name: final-ci-gate
    needs:
      - acceptance-copy-matrix
      - acceptance-profile-integration
      - acceptance-windows
      - acceptance-macos
      - rollback-matrix
      - export-policy
      - gate-zero
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every acceptance gate to succeed
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          $failed = @()
          ($env:NEEDS_JSON | ConvertFrom-Json).psobject.Properties | ForEach-Object {
            if ($_.Value.result -ne "success") { $failed += "$($_.Name)=$($_.Value.result)" }
          }
          if ($failed.Count -gt 0) { throw "Acceptance gate failed: $($failed -join ', ')" }
