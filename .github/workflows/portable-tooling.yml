name: Portable tooling

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/portable-tooling
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONNOUSERSITE: "1"

concurrency:
  group: portable-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-linux:
    name: Export and customer workflow (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out complete source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install PDF compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends texlive-latex-base

      - name: Build external tooling environment
        run: |
          python -m venv "$RUNNER_TEMP/template-tooling-venv"
          "$RUNNER_TEMP/template-tooling-venv/bin/python" -m pip install --disable-pip-version-check -r tools/requirements.txt
          echo "$RUNNER_TEMP/template-tooling-venv/bin" >> "$GITHUB_PATH"

      - name: Verify source tests and migration
        run: |
          "$RUNNER_TEMP/template-tooling-venv/bin/python" -m pytest -q -p no:cacheprovider tests/source

      - name: Exercise all profiles and folder replacement
        run: |
          "$RUNNER_TEMP/template-tooling-venv/bin/python" -m pytest -q -p no:cacheprovider \
            tools/tests/acceptance/test_copy_matrix.py \
            tools/tests/acceptance/test_tooling_replacement.py

      - name: Export the portable payload
        run: |
          mkdir -p "$RUNNER_TEMP/template-tooling-export"
          "$RUNNER_TEMP/template-tooling-venv/bin/python" tools/control.py tooling export --output "$RUNNER_TEMP/template-tooling-export"

      - name: Exercise exported customer workflow
        run: |
          VERSION="$(tr -d '\r\n' < tools/VERSION)"
          "$RUNNER_TEMP/template-tooling-venv/bin/python" tests/source/portable_ci_smoke.py \
            --export-root "$RUNNER_TEMP/template-tooling-export/Template-Tooling-$VERSION" \
            --work-root "$RUNNER_TEMP/template-tooling-customer"

      - name: Build both case studies reproducibly
        run: |
          "$RUNNER_TEMP/template-tooling-venv/bin/python" docs/toolingdocs/case-study/build.py \
            --language all --output-dir "$RUNNER_TEMP/case-study-first"
          "$RUNNER_TEMP/template-tooling-venv/bin/python" docs/toolingdocs/case-study/build.py \
            --language all --output-dir "$RUNNER_TEMP/case-study-second"
          cmp "$RUNNER_TEMP/case-study-first/portable-tooling-case-study-de.pdf" \
            "$RUNNER_TEMP/case-study-second/portable-tooling-case-study-de.pdf"
          cmp "$RUNNER_TEMP/case-study-first/portable-tooling-case-study-en.pdf" \
            "$RUNNER_TEMP/case-study-second/portable-tooling-case-study-en.pdf"

      - name: Confirm source checkout stayed clean
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"

  portable-windows:
    name: Export and portable tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Build external tooling environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "template-tooling-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scripts = Join-Path $venv "Scripts"
          $python = Join-Path $scripts "python.exe"
          & $python -m pip install --disable-pip-version-check -r tools/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TOOLING_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run portable unit and integration tests
        shell: pwsh
        env:
          TEMPLATE_TOOLING_NESTED_TEST: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider tools/tests docs/toolingdocs/case-study/tests

      - name: Export and validate copied CLI
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          $output = Join-Path $env:RUNNER_TEMP "template-tooling-export"
          New-Item -ItemType Directory -Path $output | Out-Null
          & $env:TOOLING_PYTHON tools/control.py tooling export --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content tools/VERSION -Raw).Trim()
          $export = Join-Path $output "Template-Tooling-$version"
          Push-Location $export
          try {
            & $env:TOOLING_PYTHON tools/control.py --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:TOOLING_PYTHON tools/control.py docs check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:TOOLING_PYTHON -m pytest -q -p no:cacheprovider tools/tests/core tools/tests/integration
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Confirm source checkout stayed clean
        shell: pwsh
        run: |
          $status = git status --porcelain=v1 --untracked-files=all
          if ($status) { throw "source checkout changed: $status" }
